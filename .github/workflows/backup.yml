name: Backup semanal Supabase

# Roda toda segunda-feira as 04:00 UTC (1h depois do snapshot interno do banco).
# Tambem pode ser disparado manualmente em Actions -> Backup semanal Supabase -> Run workflow.
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout codigo do projeto (scripts)
        uses: actions/checkout@v4
        with:
          path: project

      - name: Checkout repo de backups
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.BACKUP_REPO }}
          token: ${{ secrets.BACKUP_REPO_TOKEN }}
          path: backups

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instala pg_dump 17 (compativel com Supabase Postgres atual)
        run: |
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Define diretorio de destino
        id: vars
        run: |
          DATE=$(date -u +'%Y-%m-%d')
          DIR="backups/$DATE"
          mkdir -p "$DIR/storage"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: pg_dump do schema public
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          /usr/lib/postgresql/17/bin/pg_dump \
            --schema=public \
            --no-owner \
            --no-acl \
            --format=plain \
            "$DB_URL" \
            | gzip -9 > "${{ steps.vars.outputs.dir }}/database.sql.gz"

          ls -lh "${{ steps.vars.outputs.dir }}/database.sql.gz"

      - name: Download bucket app-project-attachments
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BUCKET: app-project-attachments
          OUT_DIR: ${{ steps.vars.outputs.dir }}/storage/app-project-attachments
        run: node project/scripts/backup-storage.mjs

      - name: Resumo do backup
        run: |
          du -sh "${{ steps.vars.outputs.dir }}"
          find "${{ steps.vars.outputs.dir }}" -type f | head -20

      - name: Commit e push no repo de backups
        working-directory: backups
        run: |
          git config user.name "backup-bot"
          git config user.email "backup-bot@noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "Nenhum dado novo, nada a commitar."
            exit 0
          fi
          git commit -m "Backup ${{ steps.vars.outputs.date }}"
          git push
